ESC_REPAIR_DRONES: "Repair Drones"
ESC_REPAIR_DRONES_DESC: "A complement of automated repair units deployed in emergencies to patch hull damage that would otherwise compound rapidly in the heat of battle."

ESC_BIO_REPAIR_DRONES: "Healing Enzymes Symbiots"
ESC_BIO_REPAIR_DRONES_DESC: "A colony of small symbiotes dwelling in the warbeast's outer tissue layers, capable of secreting specialized enzymes that dramatically accelerate the healing of wounds that would otherwise take much longer to close."

ESC_ADV_SHIELD_CAPACITOR: "Advanced Shield Capacitors"
ESC_ADV_SHIELD_CAPACITOR_DESC: "Higher-capacity shield banks that store more charge per cycle than previous models, translating directly into a meaningful increase in effective shield strength."

ESC_BLUE_CRYSTAL_CAPACITOR: "Crystal-Infused Shield Capacitor"
ESC_BLUE_CRYSTAL_CAPACITOR_DESC: "Crystalline materials infused into these capacitors allow them to contribute to hull integrity as well as shield strength, providing composite protection from a single component."

ESC_RED_CRYSTAL_CAPACITOR: "Crystal-Forged Shield Capacitor"
ESC_RED_CRYSTAL_CAPACITOR_DESC: "Forged with crystalline supplements woven through the substrate, these capacitors reinforce hull integrity alongside their primary function, providing broader defensive coverage than either material alone."

ESC_STELLARITE_POWER_CORE: "Stellarite Power Core"
ESC_STELLARITE_POWER_CORE_DESC: "Constructed through a reverse-engineered process originally used to fuel the Stellarite Devourer, this miniature artificial star supplies the ship's weapons with supplementary energy, increasing their output and cycle rate."

ESC_STANDARDIZED_WARHEADS: "Standardized Warheads"
ESC_STANDARDIZED_WARHEADS_DESC: "Common-specification warheads designed to fit any explosive weapon platform, reducing reload time through interchangeability and improving the safety of onboard munitions storage."

ESC_BIO_STANDARDIZED_WARHEADS: "Compartmentalized Volatiles Sacks"
ESC_BIO_STANDARDIZED_WARHEADS_DESC: "An evolved internal architecture that segments the creature's volatile-substance sacks into isolated compartments, limiting the damage from any accidental rupture and enabling faster biological projectile generation."

ESC_TEMPORAL_DISPLACER: "Temporal Displacer"
ESC_TEMPORAL_DISPLACER_DESC: "A compact device of obscure origins that bends spacetime in localized ways, applying effects that translate directly into improved odds of surviving an otherwise fatal engagement."

ESC_BIO_TEMPORAL_DISPLACER: "$ESC_TEMPORAL_DISPLACER$"
ESC_BIO_TEMPORAL_DISPLACER_DESC: "A compact device of obscure origins integrated into the warbeast's biology, bending spacetime in subtle ways to improve its odds of surviving engagements that would otherwise be fatal."

ESC_AFTERBURNER_3: "Pulsed Plasma Afterburners"
ESC_AFTERBURNER_3_DESC: "High-output plasma afterburners designed for combat maneuvering, providing the speed and agility necessary to stay ahead of weapons fire in a sustained engagement."

ESC_BIO_AFTERBURNER_1: "Simple Maneuvering Tentacles"
ESC_BIO_AFTERBURNER_1_DESC: "A growth of supplementary tentacles that augment the creature's existing propulsion and make it more responsive to directional changes during combat."

ESC_BIO_AFTERBURNER_2: "Maneuvering Tentacles"
ESC_BIO_AFTERBURNER_2_DESC: "A stronger strain of maneuvering tentacles, capable of making rapid alterations to the creature's speed and heading that the basic variant could not achieve with the same precision."

ESC_BIO_AFTERBURNER_3: "Evolved Maneuvering Tentacles"
ESC_BIO_AFTERBURNER_3_DESC: "The most capable strain of maneuvering tentacle yet produced, combining greatly increased strength with reaction times fast enough to redirect the creature nearly instantaneously in any direction it chooses."

ESC_AUX_THRUSTERS: "Auxiliary Maneuver Thrusters"
ESC_AUX_THRUSTERS_DESC: "Supplementary thrusters added to the reaction control system, improving overall maneuverability and giving the crew more options for avoiding incoming fire."

