ESC_REACTOR_BOOSTER_4: "Auxiliary Zero-Point Reactor"
ESC_REACTOR_BOOSTER_4_DESC: "A secondary zero-point reactor that augments the ship's primary power grid, providing supplementary output for systems that demand more than the main reactor can consistently supply."

ESC_BIO_REACTOR_BOOSTER_4: "Auxiliary Zero-Point Metabolism Nodule"
ESC_BIO_REACTOR_BOOSTER_4_DESC: "A cluster of supplementary organs adapted to harvest zero-point energy, feeding additional power into the creature's internal systems to support its combat capabilities."

ESC_REACTOR_BOOSTER_5: "Auxiliary Singularity Reactor"
ESC_REACTOR_BOOSTER_5_DESC: "A secondary singularity reactor operating in parallel with the main power system, ensuring the ship's most demanding components receive consistent output even under heavy load."

ESC_BIO_REACTOR_BOOSTER_5: "Auxiliary Singularity Metabolism Nodule"
ESC_BIO_REACTOR_BOOSTER_5_DESC: "Auxiliary organs paired with the creature's primary singularity harvesters, drawing additional power from the same source to sustain capabilities that the main biological system alone cannot support."

ESC_STRUCTURAL_REINFORCEMENT: "Structural Reinforcement"
ESC_STRUCTURAL_REINFORCEMENT_DESC: "Additional layers of armored material bonded to the ship's existing hull structure, distributing and absorbing impact loads that would otherwise concentrate on single points."

ESC_ADV_AUX_FIRE_CONTROL: "Advanced Fire Control Systems"
ESC_ADV_AUX_FIRE_CONTROL_DESC: "A dedicated fire control processor that generates firing solutions of exceptional precision, allowing the ship's weapons to strike at ranges and angles that would otherwise fall outside effective parameters."

ESC_BIO_AUX_FIRE_CONTROL: "Combat Synapses"
ESC_BIO_AUX_FIRE_CONTROL_DESC: "Dedicated neural pathways specialized for combat analysis that continuously feed targeting corrections to the creature's weapon organs, improving accuracy and threat prioritization across the engagement."

ESC_BIO_ADV_AUX_FIRE_CONTROL: "Evolved Combat Synapses"
ESC_BIO_ADV_AUX_FIRE_CONTROL_DESC: "A more elaborate neural architecture built on the original combat synapses, processing combat data with a depth of analysis that markedly improves the creature's targeting precision in complex engagements."

ESC_PSIONIC_REINFORCEMENT: "Psionic Reinforcement"
ESC_PSIONIC_REINFORCEMENT_DESC: "Drawing on the psionic potential of the crew, this device channels those energies outward as a protective field, strengthening both shields and hull through the collective force of minds directed at a single purpose."

ESC_PRECURSOR_ARMS_ENHANCER: "Precursor Armaments Enhancer"
ESC_PRECURSOR_ARMS_ENHANCER_DESC: "A dark-matter reactor built to precursor specifications and intended to boost the output of weapons systems, its age doing nothing to diminish the considerable improvement it provides."

ESC_NANITE_ARMOR_HARDENER: "Nanite Reactive Armor"
ESC_NANITE_ARMOR_HARDENER_DESC: "Nanites embedded in this reactive armor continuously reshape its molecular structure in response to incoming attacks, dissipating and absorbing energy with an efficiency that passive armor cannot approach."

ESC_SHIELD_HARDENER_3: "Citadel Shield Hardener"
ESC_SHIELD_HARDENER_3_DESC: "A specialized generator that dramatically increases shield field density, enabling the barrier to intercept weapons that exploit the gaps in conventional shield geometry."

ESC_ARMOR_HARDENER_LMETAL_2: "Living Absorption Plates"
ESC_ARMOR_HARDENER_LMETAL_2_DESC: "A refined living metal reactive armor that intercepts a broader range of incoming attacks than its predecessor while also contributing a modest improvement to the armor layer's baseline strength."

ESC_SHIELD_HARDENER_PSI_2: "Shroud-Enhanced Shield Hardener"
ESC_SHIELD_HARDENER_PSI_2_DESC: "Psionic energy drawn directly from the Shroud pours through this device into the ship's shields, hardening them against attacks designed to pass through standard field configurations, with any excess redirected to reinforce baseline shield strength."

mod_esc_damage_enemy_ship_on_death: "Upon death, inflict a percentage of this ship's hull and armor as damage to a nearby enemy"

ESC_AUX_DEAD_HAND_KILL_CMD_1: "Dead Hand Switch: Kill Command"
ESC_AUX_DEAD_HAND_KILL_CMD_1_DESC: "Should the ship sustain critical damage, self-destruct protocols engage automatically. Crew casualties are likely, but the resulting detonation may take at least one enemy ship with it."

ESC_BIO_AUX_DEAD_HAND_KILL_CMD_1: "Catalytic Bladder"
ESC_BIO_AUX_DEAD_HAND_KILL_CMD_1_DESC: "Sacks of highly volatile material distributed across the creature's interior will rupture upon death, releasing enough energy to threaten any enemy ships within range."

ESC_AUX_DEAD_HAND_KILL_CMD_2: "Dead Hand Switch: Annihilate Command"
ESC_AUX_DEAD_HAND_KILL_CMD_2_DESC: "Should the ship sustain critical damage, a full self-destruct sequence initiates, driving the power core to catastrophic overload. No crew will survive, but the resulting explosion is capable of seriously damaging or destroying multiple enemy ships."

ESC_BIO_AUX_DEAD_HAND_KILL_CMD_2: "Volatile Catalytic Bladder"
ESC_BIO_AUX_DEAD_HAND_KILL_CMD_2_DESC: "Greatly enlarged sacks of extremely volatile compounds, distributed through the creature's body, will detonate upon death with enough force that surviving nearby enemies would be exceptional."

mod_esc_repair_allied_ship_on_death: "Upon death, a random allied ship in the fleet regains a portion of Hull and Armor"

ESC_AUX_DEAD_HAND_HEAL_CMD_1: "Dead Hand Switch: Repair Allies Command"
ESC_AUX_DEAD_HAND_HEAL_CMD_1_DESC: "Should the ship sustain critical damage, its repair drones are automatically redirected to the nearest allied vessels. The crew will not survive, but their sacrifice may give others the margin they need."

ESC_BIO_AUX_DEAD_HAND_HEAL_CMD_1: "Restorative Enzymes Sacks"
ESC_BIO_AUX_DEAD_HAND_HEAL_CMD_1_DESC: "Enzyme-filled sacks growing across the creature's outer carapace will rupture upon death, dispersing their restorative contents into the surrounding area and accelerating regeneration in any allied creatures close enough to benefit."

ESC_AUX_DEAD_HAND_HEAL_CMD_2: "Dead Hand Switch: Support Allies Command"
ESC_AUX_DEAD_HAND_HEAL_CMD_2_DESC: "Should the ship sustain critical damage, every available repair drone and salvageable material is directed outward to allied vessels. The crew's fate is sealed, but their ship's final contribution may prove decisive."

ESC_BIO_AUX_DEAD_HAND_HEAL_CMD_2: "Supreme Restorative Enzymes Sacks"
ESC_BIO_AUX_DEAD_HAND_HEAL_CMD_2_DESC: "More potent enzyme sacks than the standard variant, distributed across the outer carapace, disperse upon the creature's death with enough restorative output to meaningfully accelerate healing in multiple nearby allies."

