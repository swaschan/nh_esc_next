## hyperthermia crisis technologies

esc_tech_energy_lens_beam_2: "Improved Flare Emitters"
esc_tech_energy_lens_beam_2_desc: "First combat uses of the Lens Flare Paralyzer and the Solar Flare Emitter showed that such a weapon has great advantages in space combat, and we would be fools not to develop this concept further."

esc_tech_energy_lens_beam_3: "Advanced Flare Cannons"
esc_tech_energy_lens_beam_3_desc: "Based on the estimations provided by our brightest minds, we can improve the power of Flare emitters even further, giving these mighty weapons the power of dying stars."

esc_tech_lm_accelerator_2: "Advanced Reshaping Projectile Accelerator"
esc_tech_lm_accelerator_2_desc: "Using advanced predictive algorithms, we can further optimize reshaping logic of $sr_living_metal$ projectile accelerators, making them even deadlier while also reducing their wear and tear."

esc_tech_lm_bio_accelerator_2: "$esc_tech_lm_accelerator_2$"
esc_tech_lm_bio_accelerator_2_desc: "$esc_tech_lm_accelerator_2_desc$"

esc_tech_lm_accelerator_3: "Flowing-shape Projectile Accelerator"
esc_tech_lm_accelerator_3_desc: "With even better predictive algorithms we can create a weapon that fires projectiles that optimize their shape according to their target on their own, after they have been already fired. This will noticeably increase deadliness of the next generation of our reshaping projectile accelerators."

esc_tech_lm_bio_accelerator_3: "$esc_tech_lm_accelerator_3$"
esc_tech_lm_bio_accelerator_3_desc: "$esc_tech_lm_accelerator_3_desc$"

esc_tech_lm_armor_6: "Regenrative Advanced Neutronium Armor"
esc_tech_lm_armor_6_desc: "With the recent breakthrough in $sr_living_metal$ sciences, we can push the durability and regeneration of Infernal armors beyond all previous limits."

esc_tech_lm_armor_7: "Regenrative Adamantium Armor"
esc_tech_lm_armor_7_desc: "Further refinement of armor-making techniques will allow us to create an even tougher version of the Infernal Neutronium Armor. Our projections suggest the resulting material will be nearly indestructible while also possessing powerful regeneration, leading some scientists to compare it to the mythical 'Adamantium'."

esc_tech_lm_armor_bio_6: "Infernal Evolved Neutronium Carapace"
esc_tech_lm_armor_bio_6_desc: "With the recent breakthrough in $sr_living_metal$ sciences, we can push the durability and regeneration of Infernal carapaces beyond all previous limits."

esc_tech_lm_armor_bio_7: "Infernal Adamantium Carapace"
esc_tech_lm_armor_bio_7_desc: "With further bio-engineering and guided evolution, we can create even stronger versions of Infernal neutronium carapaces. If our projections are right, this new strain will be nearly indestructible while also possessing powerful regeneration, leading some researchers to compare it to the mythical 'Adamantium'."
